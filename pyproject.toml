# Dev tooling config. None of this is needed to build or run the Flatpak —
# it only powers your editor's linting, formatting, and type checking.

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Enforces .claude/skills/coding-standards. Beyond the original starter set
# (E/W/F/I/UP/B/SLF) these cover the rules the standard states explicitly:
#   N     naming conventions
#   SIM   KISS — collapses needless branching
#   RET   guard clauses / early return
#   TRY   don't swallow exceptions, don't raise inside try
#   ARG   delete unused arguments
#   ERA   delete commented-out code
#   PLR09xx, C901   the complexity limits (returns/branches/args/statements)
select = [
  "E", "W", "F", "I", "UP", "B", "SLF",
  "N", "SIM", "RET", "TRY", "ARG", "ERA",
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "C901",
]
# TRY003 ("avoid long messages outside the exception class") contradicts the
# standard's own logging rule, which wants messages that name the resource and
# the reason -- ImapError(f"could not move {uid} to {destination}: {data}") is
# exactly what we want, and satisfying TRY003 means one exception subclass per
# message. That is the speculative generality the same standard forbids.
ignore = ["TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# The standard asks for "fewer than 4 parameters"; ruff excludes `self`, so 5
# here allows 4 real ones on a method.
max-args = 5

[tool.ruff.lint.per-file-ignores]
# gi.require_version() must run before the gi.repository import it configures,
# which pushes that import (and everything after it) below E402's threshold.
# (composer_window.py and message_view.py need it too; their entries are below,
# so each file keeps a single key.)
"src/postcard/application.py" = ["E402"]
"src/postcard/core/avatars.py" = ["E402"]
"src/postcard/core/secrets.py" = ["E402"]
"tests/core/test_avatars.py" = ["E402"]

# A test double has to match the signature of the thing it stands in for, so
# the arguments it ignores are load-bearing. SLF001: tests legitimately reach
# into the internals of the thing under test -- the suite already covers
# module-private helpers like _arrival_key and _fts_query.
"tests/*" = ["ARG", "SLF001"]

# --- Permanent carve-outs, with the reason -----------------------------------
# Account/Email/Folder are GObject.Object subclasses because Gio.ListStore only
# accepts GObjects, so they can't become dataclasses and every field has to be
# a constructor parameter. Mitigated by making them keyword-only instead.
"src/postcard/core/models/*.py" = ["PLR0913"]

# --- Remaining carve-outs ----------------------------------------------------
# save_account and save_email take the account/email columns as parameters; both
# insert into a table wider than 5 columns and have no natural carrier object
# (unlike save_incoming_email, which now takes a MessageHeader).
"src/postcard/core/store/database.py" = ["PLR0913"]
# fetch_mailbox and set_flag take the connection details plus what to act on.
"src/postcard/mail_sync.py" = ["PLR0913"]
# composer_window and message_view have gi.require_version gates and one wide
# constructor each; core/compose.build_mime_message takes the six parts of a
# message. threader.group's complexity is the union-find itself.
"src/postcard/composer_window.py" = ["E402", "PLR0913"]
"src/postcard/message_view.py" = ["E402", "PLR0913"]
"src/postcard/core/compose.py" = ["PLR0913"]
"src/postcard/core/threader.py" = ["C901"]

[tool.pytest.ini_options]
# The package isn't installed (meson does that at Flatpak build time), so point
# pytest at the src layout directly — no conftest.py or editable install needed.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
# "basic" catches real mistakes without fighting GTK's incomplete type stubs.
# Bump to "strict" later if you want more rigour.
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src/postcard"]
venvPath = "."
venv = ".venv"
# gi.repository submodules (Gtk, Adw, ...) are generated at runtime from
# GObject Introspection, so there's never real source to check stubs
# against — this warning is expected noise on every gi import.
reportMissingModuleSource = "none"
