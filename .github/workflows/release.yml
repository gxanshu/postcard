name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: in.gxanshu.postcard
  DOMAIN: postcard.gxanshu.in

jobs:
  # Release only when the version in meson.build has no matching git tag yet.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(grep -m1 "version:" meson.build | sed -E "s/.*'([^']+)'.*/\1/")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  # Never publish a build whose tests don't pass.
  test:
    uses: ./.github/workflows/tests.yml


  build:
    needs: [check, test]
    if: needs.check.outputs.new == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    env:
      GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up the build environment
        run: |
          # A container has no machine-id (dbus won't start) and no /dev/fuse.
          cat /proc/sys/kernel/random/uuid | tr -d '-' > /etc/machine-id
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | base64 -d | gpg --import

      # Commits are signed here, not at merge time: `ostree pull-local` copies
      # commit objects verbatim, so a signature made now survives into the
      # merged repo, and re-signing commits afterwards would mean rewriting them.
      - name: Build and sign the repo
        run: |
          flatpak-builder --force-clean --user --disable-rofiles-fuse \
            --repo=repo --gpg-sign="$GPG_KEY" build "$APP_ID.json"

      # tar first: upload-artifact flattens symlinks and drops permissions, both
      # of which an ostree object store depends on.
      - name: Pack the repo
        run: tar -cf "repo-${{ matrix.arch }}.tar" repo

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.arch }}
          path: repo-${{ matrix.arch }}.tar
          retention-days: 1

  publish:
    needs: [check, build]
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up the build environment
        run: |
          cat /proc/sys/kernel/random/uuid | tr -d '-' > /etc/machine-id
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | base64 -d | gpg --import

      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          path: artifacts
          merge-multiple: true

      - name: Merge the per-arch repos
        run: |
          # Each tarball holds its own top-level repo/, so they unpack into
          # separate directories or the second would overwrite the first.
          for tar in artifacts/repo-*.tar; do
            name=$(basename "$tar" .tar)
            mkdir -p "unpacked/$name"
            tar -xf "$tar" -C "unpacked/$name"
          done
          ostree --repo=repo init --mode=archive-z2
          # No --gpg-verify: it requires --remote, and these are artifacts from
          # this same run. The signatures ride along inside the commits.
          for dir in unpacked/*/repo; do
            ostree --repo=repo pull-local "$dir"
          done
          flatpak build-update-repo --gpg-sign="$GPG_KEY" repo
          # Fail loudly rather than publish a repo that silently lost an arch.
          for arch in x86_64 aarch64; do
            ostree --repo=repo refs | grep -qx "app/$APP_ID/$arch/master"
          done
          ostree --repo=repo refs

      - name: Assemble the site
        run: |
          mkdir site
          mv repo site/repo
          cp "data/icons/hicolor/256x256/apps/$APP_ID.png" site/icon.png
          cat > site/postcard.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Postcard
          Url=https://$DOMAIN/repo/
          Homepage=https://github.com/gxanshu/postcard
          Icon=https://$DOMAIN/icon.png
          GPGKey=$(gpg --export "$GPG_KEY" | base64 -w0)
          EOF
          # One-click install: adds the remote *and* installs the app, so users
          # never run `flatpak remote-add` themselves. RuntimeRepo is what lets
          # flatpak pull org.gnome.Platform//50 from Flathub on a fresh machine.
          # Written outside site/ deliberately — it ships as a GitHub release
          # asset only, so every install shows up in the download counter.
          cat > postcard.flatpakref <<EOF
          [Flatpak Ref]
          Title=Postcard
          Name=$APP_ID
          Branch=master
          Url=https://$DOMAIN/repo/
          Homepage=https://github.com/gxanshu/postcard
          Icon=https://$DOMAIN/icon.png
          IsRuntime=false
          SuggestRemoteName=postcard
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          GPGKey=$(gpg --export "$GPG_KEY" | base64 -w0)
          EOF

      - name: Publish to the pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: pages
          cname: ${{ env.DOMAIN }}
          force_orphan: true

      - name: Tag the release
        run: |
          git config --global --add safe.directory '*'
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # The .flatpakref is the whole Flatpak download: it points at the signed
      # repo on the pages branch, so there's no bundle to attach.
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Postcard ${{ env.VERSION }}
          files: postcard.flatpakref
          body: |
            Install or update:

            ```bash
            flatpak install --from https://github.com/gxanshu/postcard/releases/latest/download/postcard.flatpakref
            ```

            Or download `postcard.flatpakref` below and open it with your software centre.

            Available for x86_64 and aarch64 — `flatpak` picks the right one.
